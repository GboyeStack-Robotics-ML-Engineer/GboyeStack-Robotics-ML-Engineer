<text class="bt" x="400" y="96" fill="#fff">Sklearn</text></g>
<!-- OpenCV -->
<g class="a24"><rect x="462" y="78" width="95" height="36" rx="8" fill="#5C3EE8"/>
<text class="bt" x="509" y="96" fill="#fff">OpenCV</text></g>
<!-- YOLO -->
<g class="a25"><rect x="571" y="78" width="95" height="36" rx="8" fill="#00FFFF"/>
<text class="bt" x="618" y="96" fill="#000">YOLO</text></g>

<!-- ═══ SLIDE 3: Dev Tools ═══ -->
<text class="lb al3" x="400" y="46">DEV TOOLS</text>
<!-- Docker -->
<g class="a31"><rect x="80" y="78" width="95" height="36" rx="8" fill="#2496ED"/>
<text class="bt" x="127" y="96" fill="#fff">Docker</text></g>
<!-- Git -->
<g class="a32"><rect x="189" y="78" width="95" height="36" rx="8" fill="#F05032"/>
<text class="bt" x="236" y="96" fill="#fff">Git</text></g>
<!-- Linux -->
<g class="a33"><rect x="298" y="78" width="95" height="36" rx="8" fill="#FCC624"/>
<text class="bt" x="345" y="96" fill="#000">Linux</text></g>
<!-- VS Code -->
<g class="a34"><rect x="407" y="78" width="95" height="36" rx="8" fill="#007ACC"/>
<text class="bt" x="454" y="96" fill="#fff">VS Code</text></g>
<!-- Jupyter -->
<g class="a35"><rect x="516" y="78" width="95" height="36" rx="8" fill="#F37626"/>
<text class="bt" x="563" y="96" fill="#fff">Jupyter</text></g>
<!-- Streamlit -->
<g class="a36"><rect x="625" y="78" width="95" height="36" rx="8" fill="#FF4B4B"/>
<text class="bt" x="672" y="96" fill="#fff">Streamlit</text></g>

<!-- ═══ SLIDE 4: Cloud & MLOps ═══ -->
<text class="lb al4" x="400" y="46">CLOUD &amp; MLOPS</text>
<!-- AWS -->
<g class="a41"><rect x="189" y="78" width="95" height="36" rx="8" fill="#FF9900"/>
<text class="bt" x="236" y="96" fill="#000">AWS</text></g>
<!-- GCP -->
<g class="a42"><rect x="298" y="78" width="95" height="36" rx="8" fill="#4285F4"/>
<text class="bt" x="345" y="96" fill="#fff">GCP</text></g>
<!-- Render -->
<g class="a43"><rect x="407" y="78" width="95" height="36" rx="8" fill="#46E3B7"/>
<text class="bt" x="454" y="96" fill="#000">Render</text></g>
<!-- GitHub Actions -->
<g class="a44"><rect x="516" y="78" width="95" height="36" rx="8" fill="#2088FF"/>
<text class="bt" x="563" y="96" fill="#fff">Actions</text></g>

<!-- ═══ Carousel Dot Indicators ═══ -->
<circle class="ad1" cx="376" cy="148" r="5" fill="#00E5FF"/>
<circle class="ad2" cx="392" cy="148" r="5" fill="#333"/>
<circle class="ad3" cx="408" cy="148" r="5" fill="#333"/>
<circle class="ad4" cx="424" cy="148" r="5" fill="#333"/>

<!-- Decorative side lines -->
<line x1="100" y1="46" x2="280" y2="46" stroke="#161B22" stroke-width="1" class="al1"/>
<line x1="520" y1="46" x2="700" y2="46" stroke="#161B22" stroke-width="1" class="al1"/>
</svg>
