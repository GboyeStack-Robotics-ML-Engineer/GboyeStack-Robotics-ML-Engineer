<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="800" height="180">
<style>
  text{font-family:'Segoe UI',Ubuntu,sans-serif}
  .lb{font-size:20px;font-weight:700;fill:#00E5FF;text-anchor:middle}
  .bt{font-size:13px;font-weight:600;text-anchor:middle;dominant-baseline:central}

  /* Slide 1: 0-25% */
  @keyframes l1{0%{opacity:0}2%{opacity:1}21%{opacity:1}25%{opacity:0}100%{opacity:0}}
  @keyframes f11{0%{opacity:0}5%{opacity:0}7%{opacity:1}21%{opacity:1}25%{opacity:0}100%{opacity:0}}
  @keyframes f12{0%{opacity:0}7%{opacity:0}9%{opacity:1}21%{opacity:1}25%{opacity:0}100%{opacity:0}}
  @keyframes f13{0%{opacity:0}9%{opacity:0}11%{opacity:1}21%{opacity:1}25%{opacity:0}100%{opacity:0}}
  @keyframes f14{0%{opacity:0}11%{opacity:0}13%{opacity:1}21%{opacity:1}25%{opacity:0}100%{opacity:0}}

  /* Slide 2: 25-50% */
  @keyframes l2{0%{opacity:0}25%{opacity:0}27%{opacity:1}46%{opacity:1}50%{opacity:0}100%{opacity:0}}
  @keyframes f21{0%{opacity:0}30%{opacity:0}32%{opacity:1}46%{opacity:1}50%{opacity:0}100%{opacity:0}}
  @keyframes f22{0%{opacity:0}32%{opacity:0}34%{opacity:1}46%{opacity:1}50%{opacity:0}100%{opacity:0}}
  @keyframes f23{0%{opacity:0}34%{opacity:0}36%{opacity:1}46%{opacity:1}50%{opacity:0}100%{opacity:0}}
  @keyframes f24{0%{opacity:0}36%{opacity:0}38%{opacity:1}46%{opacity:1}50%{opacity:0}100%{opacity:0}}
  @keyframes f25{0%{opacity:0}38%{opacity:0}40%{opacity:1}46%{opacity:1}50%{opacity:0}100%{opacity:0}}

  /* Slide 3: 50-75% */
  @keyframes l3{0%{opacity:0}50%{opacity:0}52%{opacity:1}71%{opacity:1}75%{opacity:0}100%{opacity:0}}
  @keyframes f31{0%{opacity:0}55%{opacity:0}57%{opacity:1}71%{opacity:1}75%{opacity:0}100%{opacity:0}}
  @keyframes f32{0%{opacity:0}57%{opacity:0}59%{opacity:1}71%{opacity:1}75%{opacity:0}100%{opacity:0}}
  @keyframes f33{0%{opacity:0}59%{opacity:0}61%{opacity:1}71%{opacity:1}75%{opacity:0}100%{opacity:0}}
  @keyframes f34{0%{opacity:0}61%{opacity:0}63%{opacity:1}71%{opacity:1}75%{opacity:0}100%{opacity:0}}
  @keyframes f35{0%{opacity:0}63%{opacity:0}65%{opacity:1}71%{opacity:1}75%{opacity:0}100%{opacity:0}}
  @keyframes f36{0%{opacity:0}65%{opacity:0}67%{opacity:1}71%{opacity:1}75%{opacity:0}100%{opacity:0}}

  /* Slide 4: 75-100% */
  @keyframes l4{0%{opacity:0}75%{opacity:0}77%{opacity:1}96%{opacity:1}100%{opacity:0}}
  @keyframes f41{0%{opacity:0}80%{opacity:0}82%{opacity:1}96%{opacity:1}100%{opacity:0}}
  @keyframes f42{0%{opacity:0}82%{opacity:0}84%{opacity:1}96%{opacity:1}100%{opacity:0}}
  @keyframes f43{0%{opacity:0}84%{opacity:0}86%{opacity:1}96%{opacity:1}100%{opacity:0}}
  @keyframes f44{0%{opacity:0}86%{opacity:0}88%{opacity:1}96%{opacity:1}100%{opacity:0}}

  /* Dot indicators */
  @keyframes d1{0%{fill:#00E5FF}24%{fill:#00E5FF}25%{fill:#333}100%{fill:#333}}
  @keyframes d2{0%{fill:#333}25%{fill:#00E5FF}49%{fill:#00E5FF}50%{fill:#333}100%{fill:#333}}
  @keyframes d3{0%{fill:#333}50%{fill:#00E5FF}74%{fill:#00E5FF}75%{fill:#333}100%{fill:#333}}
  @keyframes d4{0%{fill:#333}75%{fill:#00E5FF}100%{fill:#00E5FF}}

  .al1{opacity:0;animation:l1 16s infinite}
  .a11{opacity:0;animation:f11 16s infinite}.a12{opacity:0;animation:f12 16s infinite}
  .a13{opacity:0;animation:f13 16s infinite}.a14{opacity:0;animation:f14 16s infinite}

  .al2{opacity:0;animation:l2 16s infinite}
  .a21{opacity:0;animation:f21 16s infinite}.a22{opacity:0;animation:f22 16s infinite}
  .a23{opacity:0;animation:f23 16s infinite}.a24{opacity:0;animation:f24 16s infinite}
  .a25{opacity:0;animation:f25 16s infinite}

  .al3{opacity:0;animation:l3 16s infinite}
  .a31{opacity:0;animation:f31 16s infinite}.a32{opacity:0;animation:f32 16s infinite}
  .a33{opacity:0;animation:f33 16s infinite}.a34{opacity:0;animation:f34 16s infinite}
  .a35{opacity:0;animation:f35 16s infinite}.a36{opacity:0;animation:f36 16s infinite}

  .al4{opacity:0;animation:l4 16s infinite}
  .a41{opacity:0;animation:f41 16s infinite}.a42{opacity:0;animation:f42 16s infinite}
  .a43{opacity:0;animation:f43 16s infinite}.a44{opacity:0;animation:f44 16s infinite}

  .ad1{animation:d1 16s infinite}.ad2{animation:d2 16s infinite}
  .ad3{animation:d3 16s infinite}.ad4{animation:d4 16s infinite}
</style>

<!-- Background -->
<rect width="800" height="180" rx="16" fill="#0D1117" stroke="#161B22" stroke-width="1.5"/>

<!-- ═══ SLIDE 1: Languages ═══ -->
<text class="lb al1" x="400" y="46">LANGUAGES</text>
<!-- Python -->
<g class="a11"><rect x="189" y="78" width="95" height="36" rx="8" fill="#3776AB"/>
<text class="bt" x="236" y="96" fill="#fff">Python</text></g>
<!-- C++ -->
<g class="a12"><rect x="298" y="78" width="95" height="36" rx="8" fill="#00599C"/>
<text class="bt" x="345" y="96" fill="#fff">C++</text></g>
<!-- JavaScript -->
<g class="a13"><rect x="407" y="78" width="95" height="36" rx="8" fill="#F7DF1E"/>
<text class="bt" x="454" y="96" fill="#000">JavaScript</text></g>
<!-- SQL -->
<g class="a14"><rect x="516" y="78" width="95" height="36" rx="8" fill="#4479A1"/>
<text class="bt" x="563" y="96" fill="#fff">SQL</text></g>

<!-- ═══ SLIDE 2: ML / AI ═══ -->
<text class="lb al2" x="400" y="46">ML / AI FRAMEWORKS</text>
